services:
  # Standalone Backend API Service
  - type: web
    name: nearby-helpup-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/listings/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nearby-helpup-db
          property: connectionString

databases:
  - name: nearby-helpup-db
    databaseName: nearby_helpup
    user: nearby_user
    region: singapore
    plan: free
